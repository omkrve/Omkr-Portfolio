<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Omkr — Cloud engineer and visual designer</title>
    <meta
      name="description"
      content="Portfolio of Omkr: AWS and infrastructure-as-code projects, plus brand and campaign design."
    />
    <meta property="og:title" content="Omkr — Cloud engineer and visual designer" />
    <meta
      property="og:description"
      content="AWS, Terraform and CI/CD projects alongside brand identities and campaign visuals."
    />
    <meta property="og:type" content="website" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
